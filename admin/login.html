<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Login - Parafestas Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin-style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Parafestas Admin</h1>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="admin@parafestas.com">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div id="login-error" class="error-msg">Usuário ou senha incorretos.</div>
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Entrar</button>
      </form>
    </div>
  </div>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
