<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Dashboard - Parafestas Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin-style.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">Parafestas Centro</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard">Dashboard</a>
        <a href="#" class="nav-item" data-view="analytics">Analytics Executivo</a>
        <a href="#" class="nav-item" data-view="crm">Leads / CRM</a>
        <a href="#" class="nav-item" data-view="funil">Funil de Conversão</a>
        <a href="#" class="nav-item" data-view="vendas">Vendas</a>
        <a href="#" class="nav-item" data-view="campanhas">Campanhas</a>
        <a href="#" class="nav-item" data-view="meta_ads">Meta Ads</a>
        <a href="#" class="nav-item" data-view="pixel_api">Pixel & API</a>
        <a href="#" class="nav-item" data-view="financeiro">Financeiro</a>
        <a href="#" class="nav-item" data-view="logs">Logs</a>
        <a href="#" class="nav-item" data-view="config">Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" class="nav-item logout-btn" id="logout-btn">Sair</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h2 id="page-title">Centro de Comando Parafestas</h2>
        <div class="header-filters">
          <select id="date-filter" class="admin-select">
            <option value="hoje">Hoje</option>
            <option value="ontem">Ontem</option>
            <option value="7d">Últimos 7 dias</option>
            <option value="14d">Últimos 14 dias</option>
            <option value="30d" selected>Últimos 30 dias</option>
            <option value="este_mes">Este mês</option>
            <option value="mes_anterior">Mês anterior</option>
            <option value="tudo">Todo período</option>
          </select>
        </div>
        <div class="header-status">
          <span class="status-indicator"></span> <span id="sync-status">Atualizado agora</span>
        </div>
      </header>

      <div class="admin-content" id="content-area">
        <!-- Views injetadas via JS -->
      </div>
    </main>
  </div>

  <script type="module" src="./js/admin-main.js"></script>
</body>
</html>
